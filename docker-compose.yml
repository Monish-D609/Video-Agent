services:
  video-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-agent:latest
    container_name: video-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - CACHE_DIR=/app/downloads
    volumes:
      - ./downloads:/app/downloads
      - ./vector_db:/app/vector_db
      - model_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --url http://127.0.0.1:8000
    depends_on:
      - video-agent

volumes:
  model_cache:
